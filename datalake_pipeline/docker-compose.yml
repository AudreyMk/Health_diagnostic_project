##############################################################################
# docker-compose.yml — MedRAG v2
#
# Services Phase A (infrastructure base de données uniquement) :
#   - PostgreSQL 16 + pgvector   → embeddings + retrieval sémantique
#   - MongoDB 7                  → centres de santé FINESS (géospatial)
#   - pgAdmin 4                  → interface web PostgreSQL
#   - Mongo Express              → interface web MongoDB
#
# Usage :
#   docker compose up -d                  # Démarrer tout
#   docker compose down -v                # Arrêter + supprimer volumes (reset propre)
#   docker compose logs -f medrag-v2-postgres
#
# Accès :
#   PostgreSQL   → localhost:5433  (medrag / medrag_2024 / db: medrag)
#   MongoDB      → localhost:27018 (medrag / medrag_2024)
#   pgAdmin      → http://localhost:5051  (admin@medrag.com / admin)
#   MongoExpress → http://localhost:8082  (admin / admin)
#
# IMPORTANT : ports décalés (+1) pour éviter les conflits avec medrag v1
##############################################################################

services:

  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    container_name: medrag-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medrag
      POSTGRES_PASSWORD: medrag_2024
      POSTGRES_DB: medrag
    ports:
      - "5433:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medrag -d medrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    platform: linux/amd64
    container_name: medrag-v2-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: medrag
      MONGO_INITDB_ROOT_PASSWORD: medrag_2024
      MONGO_INITDB_DATABASE: medrag
    ports:
      - "27018:27017"
    volumes:
      - mongodata_v2:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "medrag", "-p", "medrag_2024"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    platform: linux/amd64
    container_name: medrag-v2-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medrag.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5051:5050"
    volumes:
      - pgadmindata_v2:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  mongo-express:
    image: mongo-express:latest
    platform: linux/amd64
    container_name: medrag-v2-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: medrag
      ME_CONFIG_MONGODB_ADMINPASSWORD: medrag_2024
      ME_CONFIG_MONGODB_URL: mongodb://medrag:medrag_2024@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8082:8081"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  pgdata_v2:
    name: medrag-v2-pgdata
  mongodata_v2:
    name: medrag-v2-mongodata
  pgadmindata_v2:
    name: medrag-v2-pgadmindata
